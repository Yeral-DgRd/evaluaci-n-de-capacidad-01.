<body>

    <div class="content" id="mainContent">
        <header class="scroll-animate">
            <div>
                <h1><i class="fa-solid fa-photo-film"></i> Galería Multimedia</h1>
                <p>Colección de imágenes, audio y archivos de video</p>
            </div>
            <div class="gallery-badge">
                <i class="fa-solid fa-images"></i> 
            </div>
        </header>

        <main class="scroll-animate">
            <h2 class="section-title"><i class="fa-solid fa-camera"></i> Álbum Fotográfico</h2>

            <div class="gallery-grid">
      
                <div class="gallery-card">
                    <img src="img/activity_coding.png" alt="Programando">
                </div>

                <div class="gallery-card">
                    <img src="img/activity_presenting.png" alt="Laboratorio Think Tank">
                </div>

                <div class="gallery-card">
                    <img src="img/portrait_pose_1.png" alt="Gatito">
                </div>

                <div class="gallery-card">
                    <img src="img/portrait_pose_2.png" alt="Anghelo">
                </div>

                <div class="gallery-card">
                    <img src="img/portrait_pose_3.png" alt="Retrato">
                </div>
            </div>

            <h2 class="section-title"><i class="fa-solid fa-headphones"></i> Reproductores Multimedia</h2>

            <div class="media-container-grid">
   
                <div class="media-player-card">
                    <div class="media-header">
                        <div class="media-header-title">
                            <i class="fa-solid fa-music"></i> Audio Demo
                        </div>
                        <div class="equalizer-icon">
                            <div class="equalizer-bar"></div>
                            <div class="equalizer-bar"></div>
                            <div class="equalizer-bar"></div>
                        </div>
                    </div>
                    <audio controls preload="metadata">
                        <source src="audio/p_21333326_694.mp3" type="audio/ogg">
                        Tu navegador no soporta el reproductor de audio.
                    </audio>
                </div>

                <div class="media-player-card">
                    <div class="media-header">
                        <div class="media-header-title">
                            <i class="fa-solid fa-film"></i> Video Presentación
                        </div>
                    </div>
                    <div class="video-wrapper">
                        <video controls preload="metadata">
                            <source src="video/Pippit_0923_SubtlePortrait.mp4" type="video/mp4">

                </div>
            </div>
        </main>

        <footer>

        </footer>
    </div>

    <script>
        // Cursor Seguidor Neón
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Scroll Reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); }
                else { entry.target.classList.remove('visible'); }
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.scroll-animate').forEach(el => observer.observe(el));

        // Partículas Neón
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < (canvas.width * canvas.height) / 12000; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 0.8, speedY: (Math.random() - 0.5) * 0.8
                });
            }
        }
        window.addEventListener('resize', initCanvas);
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        initCanvas(); animateParticles();
    </script>
</body>
